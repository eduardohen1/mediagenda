<div class="row">
    <div class="col=-md-4 mb-3">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <i class="fas fa-user-md mr-2"></i>
                Cadastro de Médicos - JAVA
            </div>

            <div class="card-body">
                <div class="table table-striped table-hover">
                    <thead class="thead-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>CRM</th>
                            <th>Especialidade</th>
                            <th>...</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of medicos">
                            <td>{{ item.id }}</td>
                            <td>{{ item.nome }}</td>
                            <td>{{ item.crm }}</td>
                            <td>{{ item.especialidadeId }}</td>
                            <td>...</td>
                        </tr>
                    </tbody>
                </div>
            </div>

        </div>
    </div>
</div>
